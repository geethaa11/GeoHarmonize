name: Tests

on:
  push:
    branches:
      - main
      - feature/geospatial-etl
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r conflict_detection_sih26013/conflict_detection/requirements.txt

      - name: Check package structure
        run: |
          echo "Repository:"
          pwd
          echo "Conflict detection package:"
          ls -la conflict_detection_sih26013/conflict_detection
          echo "ETL package:"
          ls -la etl

      - name: Run tests
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/conflict_detection_sih26013:${GITHUB_WORKSPACE}"
          echo "PYTHONPATH=$PYTHONPATH"
          python -c "import conflict_detection; print('conflict_detection import: OK')"
          python -c "import etl; print('etl import: OK')"
          pytest -v
